{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Create Account</h2>
    <div class="alert error" id="err"></div>
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="name" placeholder="Your name" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min 6 characters" />
    </div>
    <button class="btn" onclick="doSignup()">Create Account</button>
    <p class="form-footer">Already have an account? <a href="/login">Login</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function doSignup() {
  const err = document.getElementById("err");
  err.style.display = "none";
  try {
    const data = await api.signup({
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
    });
    // Auto-login after signup by going to login page
    window.location.href = "/login?registered=1";
  } catch(e) {
    err.textContent = e.message;
    err.style.display = "block";
  }
}
document.addEventListener("keydown", e => { if(e.key==="Enter") doSignup(); });
</script>
{% endblock %}
